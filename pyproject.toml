[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datarecon"
version = "0.1.0"
description = "Explainable dataset reconciliation: find out why two datasets do not match."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pandas>=2.0", "numpy>=1.23"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
datarecon = "datarecon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
